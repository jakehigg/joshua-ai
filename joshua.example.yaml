# The one joshua config file. Copy it, edit it, and mount it at
# /etc/joshua/joshua.yaml. Secrets never live here — put them in .env and
# reference them as ${VAR:-}, as the channels section below shows. The ${VAR:-}
# form expands to the empty string where the variable is not set, so only the
# container that owns a secret defines it, and an empty credential turns the
# feature off. Validate a file
# before you deploy it:
#
#   python -m joshua_shared.config validate joshua.example.yaml

name: Home
timezone: America/New_York
people:
  - id: alex
    name: Alex
    role: member
    journal: auto                 # auto | ask | off — may Joshua's journal record this person (default auto)
    handles:
      telegram: "998877"
      imessage:                   # one handle, or a list when a person has several
        - "+15551234567"
        - "alex@example.com"
  - id: mia
    name: Mia
    role: member
    handles:
      telegram: "112233"
      imessage: "+15557654321"
groups:
  - id: everyone
    channel: imessage
    chat_id: "iMessage;+;chat100000000000000001"
    members:                      # platform handles, never person ids
      - "+15551234567"
      - "+15557654321"

channels:
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN:-}
    unknown_sender: drop          # Telegram never replies to a stranger unless this is 'reply'
  imessage:
    bluebubbles_url: http://bluebubbles.local:1234
    bluebubbles_password: ${BLUEBUBBLES_PASSWORD:-}
    webhook_path_secret: ${IMESSAGE_WEBHOOK_SECRET:-}
    dm_service: iMessage          # the service in a DM guid Joshua builds; 'any' on a server whose guids start with any;
    unknown_sender: drop          # iMessage never replies to a stranger unless this is 'reply'
    coalesce_window_s: 2.0        # merge a burst from one sender into one turn; 0 disables
    stale_max_age_s: 900.0        # drop a webhook older than this (a replay); 0 disables
    reconcile_interval_s: 60      # poll BlueBubbles for missed webhooks this often; 0 disables
    reconcile_lookback_s: 300     # how far back the poll watermark starts at boot
    send_chunk_chars: 4000        # split an outbound reply into chunks of this size
  # An OpenAI-compatible route for any voice front end. Remove the block and
  # there is no voice route. `people[].handles.voice` names each speaker.
  # voice:
  #   allowed_callers:
  #     - voice                  # the fleet identity the front end sends
  #   thread: person             # person: one conversation across devices; device: one for each
  #   min_confidence: 0.6        # below this, the speaker name is not trusted
  #   identity_hold_s: 120       # how long a device keeps its last trusted identity
  #   unknown_sender: drop       # drop | reply, for a speaker Joshua cannot name
  #   device_defaults:           # a device that never sends a speaker name defaults to this person
  #     mobile: alex
  #   max_text_chars: 4000       # a spoken turn is short
  #   model: claude-sonnet-5     # a spoken turn must answer fast
  #   idle_ttl_s: 300            # a voice session closes sooner than a chat
  #   deliver_via: imessage      # imessage | telegram; a reminder made by voice arrives here instead
  webhooks:
    allowed_callers:
      - laptop
      - ci
  destinations:
    everyone: imessage:group:everyone
  limits:
    max_text_chars: 8000
    max_attachment_bytes: 26214400
    per_handle_per_minute: 20
    attachment_retention_days: 365     # delete stored attachments older than this; 0 keeps forever
    keep_originals: false              # also store the pre-downscale original next to the stored file

core:
  model: claude-opus-5
  max_turns: 20
  session_idle_seconds: 1800
  pool_max: 20
  mcp_replace_seconds: 300     # replace a session whose client marked a gateway server failed, at most once in this time
  reflection_model: claude-sonnet-5
  scheduler_tick_seconds: 15   # how often the scheduler checks for due tasks

memory:
  # The journal reaches a turn through retrieval only; nothing here holds its text.
  shared_max_chars: 2000  # cap for the shared section (members and group sessions)
  nightly_at: "03:30"           # local time of the nightly reflection run
  daily_rollover: true          # after the nightly run, start each session fresh
  min_chars_for_post: 200       # skip the day's journal page below this much combined transcript
  inject:
    enabled: true      # prepend relevant notes/files to each turn (RAG injection)
    full_sim: 0.72     # top match ≥ this → inject chunk bodies (zero tool calls)
    hint_sim: 0.60     # top match ≥ this → name the files as a hint
    top_k: 2           # chunks injected on a `full` decision
    max_chars: 1200    # per-chunk text cap in the note and the audit row
  skills:
    enabled: true        # match each turn against taught skills (wiki/skills/<slug>.md)
    # A skill is matched by phrase: the turn must open with the trigger. This
    # is how many extra words that carry meaning the turn may hold inside the
    # match. 2 allows one inserted object ("add MILK to the list").
    # 0 demands the words exactly.
    max_extra_words: 2
    # Only for a page that sets `match: semantic`. Similarity over short
    # phrases has a high floor: two unrelated triggers measure about 0.62 with
    # the default model, so this has to sit well above that.
    min_sim: 0.80
    top_k: 3             # most skills one turn can carry as notes
  # Core's search by meaning, POST /v1/memory/search. It finds wiki pages,
  # journal entries, and profiles, and nothing else. Each caller needs a
  # JOSHUA_TOKEN_<NAME> in .env. An empty list turns the route off.
  search:
    allowed_callers:
      - viewer                 # the web viewer
      - mcp                    # the joshua-mcp addon
  embed_model: BAAI/bge-small-en-v1.5
  # In-core RAG over the data volume. `files` is the kernel source and always
  # runs; other adapters are optional. An adapter with no options takes an empty
  # value.
  sources:
    files:
    # Optional: scrape a Memos instance into the index, read-only. The token
    # needs read access only; give the Memos user no more visibility than the
    # you want indexed. Uncomment to enable.
    # memos:
    #   url: https://memos.example.net
    #   token: ${MEMOS_TOKEN:-}        # from .env, never inline
    #   schedule: nightly              # nightly | "every 6h" | seconds
    #   scope: shared                  # shared | person:<id>
    #   visibility:                    # PRIVATE memos are never indexed
    #     - PROTECTED
    #     - PUBLIC
    #   person_tag_prefix: "person/"   # a memo tagged person/alex lands under alex
  index_interval_s: 60      # how often the files source re-indexes the volume
  # Retrieval tuning (ported from joshua-kb).
  chunk_chars: 1600
  min_sim: 0.55
  per_doc_cap: 3
  recency_bonus: 0.08
  recency_half_life_days: 14.0
  # Snapshots: fixed MCP tool calls that core runs on a cadence, with no
  # model. The output goes into the index and replaces the last output, so a
  # turn can see that an open item matches what a person says. The list is
  # the allowlist: no caller can ask for another tool or other arguments.
  # Empty (the default) runs nothing. docs/memory.md explains it.
  # snapshots:
  #   - name: open-tasks           # a unique slug
  #     server: tasks              # a name under mcp:, or scheduling (core's own)
  #     tool: list_open_tasks      # the exact tool; on scheduling only list_tasks
  #     args:                      # passed as is; every value is text
  #       list: home
  #     every: 15m                 # 1m to 24h
  #     scope: alex                # shared, or a person id the server allows
  #     items: result.tasks        # optional dotted path to the list in JSON
  #     fields:                    # optional: the keys of each item to keep
  #       - title
  #       - due
  #     max_chars: 20000           # the output is cut here
  #     max_age: 45m               # default 3 x every, at least 15m
  #     jobs: false                # true: a job bundle may take a snapshot of one
  #                                # person; a shared snapshot is in a bundle always

attachments:
  # false: a file a person sends stays in the record of the chat, and the
  #        retention sweep deletes it after channels.limits.attachment_retention_days.
  #        Joshua copies one into the wiki when a page needs it.
  # true:  a file a member sends moves into wiki/attachments/ as the turn starts.
  #        Retention never deletes it, so a page keeps its picture.
  # A guest's file never moves: a guest does not write the wiki.
  auto_save: false
  describe:
    # A small model looks at each picture, and at a PDF that holds no text
    # layer, before the turn is matched. It gives the turn real words, so a
    # photo with no caption reaches the right taught skill. It has no tool and
    # sees no message of the conversation. A failure leaves the turn as it was.
    enabled: true
    model: claude-haiku-4-5
    timeout_seconds: 30   # a receipt read off a picture measured 15 seconds
  extract:
    max_chars: 100000     # how much text one attachment keeps
    embed: true           # put that text in the search index, marked as external

internet:
  # The internet agent looks up on the open web what Joshua holds no page for:
  # a recipe, a specification, an opening time. It is a worker that holds
  # nothing else: no wiki, no journal, no profile, and no message of the
  # conversation. What comes back reaches Joshua as content from outside, never
  # as an instruction.
  enabled: true
  model: claude-sonnet-5
  timeout_seconds: 120     # a search, a read, and an answer take time
  max_turns: 12            # the ceiling on what one question costs
  fetch:
    # A search runs on Anthropic's side and makes no connection from this
    # container. Reading a page does make one, from here. It is off when this
    # section is missing, and this file turns it on. The worker reads only a
    # page it was given (a link a person sent) or a page its own search
    # returned, and never a URL it read on a page.
    enabled: true

    # THIS LIST IS THE WHOLE POLICY FOR A PLACE. Nothing is blocked that it
    # does not name, and an empty list blocks nothing at all. What is below is
    # a starting point a careful person would keep: every private network, the
    # loopback, the zero address, carrier-grade NAT (where a Tailscale address
    # lives), and the address that carries cloud credentials. Delete what you
    # do not want, and add your own names.
    #
    # An entry is a CIDR, a domain (which covers every host under it), a
    # pattern such as "*.example.net", a host, or plain text to look for in
    # the URL. An IPv6 address that carries an IPv4 address is checked
    # against the IPv4 entries too.
    blocked:
      - 0.0.0.0/8             # "this network"; 0.0.0.0 reaches this machine
      - 10.0.0.0/8            # RFC 1918
      - 100.64.0.0/10         # carrier-grade NAT, and Tailscale
      - 127.0.0.0/8           # loopback
      - 169.254.0.0/16        # link local, and the cloud metadata address
      - 172.16.0.0/12         # RFC 1918
      - 192.168.0.0/16        # RFC 1918
      - "::/128"              # the unspecified address, IPv6
      - "::1/128"             # loopback, IPv6
      - "fc00::/7"            # unique local, IPv6
      - "fe80::/10"           # link local, IPv6
      - localhost
      - .local                # mDNS
      - .internal
      - .home.arpa
      - .svc                  # a service inside Kubernetes
      - .cluster.local
      # Your own names go here:
      # - example.net         # the domain, and every host under it
      # - nas                 # a plain word, looked for in the whole URL

    # Look the host up, and refuse a name that resolves into a CIDR above.
    resolve_hosts: true

jobs:
  # The jobs core runs by hand: you start a run from the laptop with
  # scripts/jobs.sh, and nothing schedules one. Each run writes one journal
  # entry and makes one wiki commit. docs/jobs.md explains them.
  enabled: false           # false: every /admin/jobs/* route answers 404
  # model: claude-sonnet-5 # the model of every job worker; when it is not set,
  #                        # core.reflection_model (internet.model for a lookup)
  bundle:
    # The memory bundle: what a job reads about one topic.
    sim: 0.78              # a journal chunk this close to the topic page is about it
    max_vector_entries: 6  # entries that only that similarity brings in, the closest first
    # Globs on the file stem of a journal entry that no bundle takes. The
    # values belong to one instance, for example a daily log:
    # exclude_slugs:
    #   - "garden-weather-log-*"
    max_chars: 24000       # the bundle text stops here; the topic page is never cut
    recent_days: 14        # how far back the researcher looks for what people name now
    # snapshot_sim: 0.55   # a snapshot item this close to the topic page is a candidate
    # snapshot_strong_sim: 0.75  # a candidate that does not name the topic needs this
    # snapshot_items: 12   # the most snapshot items in one bundle, the closest first
    # snapshot_chars: 3000 # the size limit of the snapshot block
  topics:
    # A topic is one leaf page of the wiki. These globs, relative to the wiki
    # root, name the pages that are not topics.
    exclude:
      - vocabulary.md
      - "*/README.md"
      - "coach/profiles/*" # a page about one person is not a topic
  curator:
    # The curator keeps the wiki and the journal correct and organized: links,
    # index pages, stray files, the place of a page, duplicates, and pages the
    # journal has made old. docs/jobs.md explains the tiers.
    enabled: false         # true: the curator job and the curator chat tool
    # model: claude-sonnet-5 # the model of its workers; when it is not set,
    #                        # jobs.model, then core.reflection_model
    # models:                # the model of one worker, before model
    #   place: claude-sonnet-5   # finds the section of a stray page
    #   compare: claude-opus-5   # reads two pages that overlap
    #   refresh: claude-sonnet-5 # writes a stale page again
    max_worker_calls: 40   # the worker calls one run may make
    duplicate_sim: 0.92    # two topic pages this close are a near-duplicate pair
    overlap_sim: 0.70      # two pages of one section this close are compared too
    # apply:               # the Tier B actions a run applies; none by default.
    #   - move             # move a page to the folder it belongs in
    #   - merge            # point every link at one of two duplicates
    #   - refresh          # apply a patch that the journal supports
    trash: true            # true: move a stray file to wiki/.trash/<day>/;
                           # false: record it as a finding only
  research:
    # The researcher keeps wiki/knowledge/: cited, challenged facts about one
    # topic at a time, in a dossier per topic. docs/jobs.md explains it.
    enabled: false         # true: the research job and the research chat tool
    # model: claude-sonnet-5 # the model of its workers; when it is not set,
    #                        # jobs.model, then core.reflection_model, or
    #                        # internet.model for the lookups
    # models:                # the model of one worker, before model
    #   raise: claude-opus-5     # adds the questions of a topic
    #   apply: claude-sonnet-5   # answers from the knowledge we hold
    #   editor: claude-opus-5    # writes the page from the two lookups
    #   lookup: claude-sonnet-5  # the researcher and the challenger; the chat
    #                            # tool use_internet keeps internet.model
    topics_per_run: 1      # the topics one run works on; only 1 is supported
    questions_per_topic: 8 # the questions one raise call may add, less the open ones
    questions_per_run: 3   # the questions one run researches
    coverage_target: 0.6   # a topic below this coverage is due for research
    dup_sim: 0.85          # a new question this close to a known one is a duplicate
    record_sim: 0.80       # a record this close answers a question for our records;
                           # below it, the question goes to wiki/questions/ for a person
    apply_sim: 0.70        # a published knowledge page this close to a question goes to
                           # the apply worker before any lookup
    apply_pages: 5         # the most such pages the apply worker gets for one question
    max_holds: 2           # a question held this many times is dropped
    refresh_days: 180      # a researched topic is due again after this many days
    lookup_timeout_seconds: 300 # one lookup of the researcher or the challenger;
                           # it replaces internet.timeout_seconds for these lookups
    lookup_max_turns: 14   # the turn ceiling of one such lookup; it replaces
                           # internet.max_turns for these lookups
    lookup_max_age_days: 7 # a held question keeps its two lookups this many
                           # days; a later run gives them to the editor again
    editor_timeout_seconds: 240 # one call of the editor, which has no tools
    trusted_domains:       # the editor may not grade a page here weak. An entry
      - .edu               # that starts with a dot matches the end of a host;
      - .gov               # an entry that ends with a dot matches its start
      - .ac.uk
      - extension.
      - .int
    distrusted_domains:    # the editor always grades a page here weak
      - pinterest.com
      - quora.com
      - answers.com
      - ehow.com
      - wikihow.com
      - facebook.com
      - reddit.com
    person_sections:       # wiki sections (first path segment) whose pages are
      - coach              # about people: the researcher asks a person about a
      - people             # topic there, never the web
  insights:
    # The insights job keeps wiki/insights/: where what we do, in the wiki and
    # the journal, disagrees with what is known in knowledge/, for the date and
    # the season. docs/jobs.md explains it.
    enabled: false         # true: the insights job and the insights chat tool
    # model: claude-sonnet-5 # the model of its tool-less insight worker; when it
    #                        # is not set, jobs.model, then core.reflection_model
    max_per_run: 5         # the new insights one run writes, highest severity first
    dup_sim: 0.88          # a new claim this close to an insight of the topic is a duplicate
    default_valid_days: 60 # valid_until is this many days after today when the worker gives none
    after_research: true   # a research run that published a page runs the insight
                           # pass for the same topic, in the same run and commit
    snooze_days: 7         # the first snooze of an insight when a person gives no
                           # days; each later snooze is twice as long
    snooze_max_days: 90    # the longest snooze
  digest:
    # The digest job writes one journal entry for a run of near-duplicate
    # entries, and the index and the bundles leave the covered entries out.
    # They stay on the disk. docs/jobs.md explains it.
    enabled: false         # true: the digest job
    # model: claude-sonnet-5 # the model of its tool-less digest worker; when it
    #                        # is not set, jobs.model, then core.reflection_model
    min_age_days: 30       # only entries older than this many days
    min_entries: 4         # the fewest entries in a group
    sim: 0.85              # two entries this close by meaning are in one group
    max_groups: 5          # the groups that one run digests, largest first
    max_entries: 40        # the most entries that one digest covers

wiki:
  git: true   # keep /data/wiki as a git repository Joshua commits; false leaves
              # git to a frontend or a sync tool

mcp:
  files:                          # builtin, always available in the image
    kind: builtin
    allow: all

  # Add a server by naming its package. The gateway installs it into its store
  # volume at start, so you never build an image. Every kind must pin an exact
  # version: npm:<name>@1.2.3, pypi:<name>==1.2.3, git+https://<url>@<commit>,
  # or an https:// file with its sha256.
  #
  # Put each credential in `.env.gateway` and refer to it with ${VAR:-}. An
  # entry whose credential is empty is turned off, not retried.
  #
  # docs/mcp-servers.md has tested entries for weather, Home Assistant, GitLab
  # and Trello. docs/config.md explains the field.
  #
  # weather:
  #   type: stdio
  #   package: npm:@dangahagan/weather-mcp@1.6.1
  #   env:
  #     ENABLED_TOOLS: standard
  #   allow: all

modules:                        # reserved; no code reads this list yet
  - scheduling
  - files

viewer:                         # a read-only web viewer for the wiki and a
                                # person's own files. Off by default.
  enabled: false
  # One entry per person who may sign in, id -> password reference. A member can
  # also delete a wiki page. This list says who may sign in; a person who is not
  # a key here cannot sign in, whatever the environment holds. A key must name a
  # person in `people`.
  #
  # Leave the value empty and put the password in `VIEWER_PASSWORDS` in `.env`,
  # so no password is in this file. A `$2` value is a bcrypt hash; any other
  # value is a literal password. Uncomment to add a person:
  # users:
  #   alex: ""
  #
  # On a trusted private network, a household can skip sign-in entirely: a
  # request with no password then gets full access, read and write, the same
  # as a member. Add `users` above to bring restrictions back. Uncomment to
  # turn it on:
  # anonymous: true

usage:
  # Core's GET /v1/usage: the tokens of each day, for the chat and for each
  # job. The usage page of the viewer reads it. Each caller needs a
  # JOSHUA_TOKEN_<NAME> in .env. An empty value turns the route off.
  # GET /admin/usage gives the same answer to an admin caller.
  allowed_callers:
    - viewer                   # the web viewer
