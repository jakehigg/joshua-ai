[project]
name = "joshua-shared"
version = "0.0.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "strictyaml>=1.7",
]

[project.scripts]
joshua-config = "joshua_shared.config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
