[project]
name = "joshua-assignments"
version = "0.0.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "joshua-shared",
    "claude-agent-sdk>=0.2.165",
    "httpx>=0.27",
    "mcp>=1.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
# The SDK starts this command as the Claude CLI. It runs the CLI through the
# session launcher, as the `session` user (joshua_assignments/launcher.py).
joshua-session-cli = "joshua_assignments.launcher:wrapper_main"

[tool.uv.sources]
joshua-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
