[project]
name = "joshua-assignments"
version = "0.0.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "joshua-shared",
    "httpx>=0.27",
    "mcp>=1.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[tool.uv.sources]
joshua-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
