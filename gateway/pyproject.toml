[project]
name = "joshua-gateway"
version = "0.0.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "joshua-shared",
    "mcp>=1.2",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "pypdf>=6.19.0",
    "markdown-it-py>=3.0",
    "bcrypt>=4.0",
    "httpx>=0.27",
]

[tool.uv.sources]
joshua-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
