<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#080d17" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080d17" />
    <title>Joshua</title>
    <!-- The installed app, scoped to `/`: the whole viewer, not the chat
         alone. `use-credentials` sends the sign-in of the page with the
         manifest, which the viewer asks for like any other address. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Joshua" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
