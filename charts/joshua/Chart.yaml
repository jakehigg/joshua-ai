apiVersion: v2
name: joshua
description: A personal AI agent you host yourself, as three containers and one shared volume.
type: application
# The chart version and the application version are always the same, and a
# release moves both. The chart and the three containers ship together, and an
# interface between them can change in any release before 1.0, so a chart must
# never meet an image it did not ship with. `make check-chart-version` and the
# `chart` CI job refuse a file where the two disagree.
#
# A `v*` tag builds the images at the tag version and packages the chart with
# `--version` and `--app-version` set to it, so a release keeps the two the
# same without reading this file. Bump both here in the change that needs a
# release, and tag the merge commit.
version: 0.0.5
# An empty `image.tag` in values means this version, so the chart pulls the
# images that shipped with it.
appVersion: "0.0.5"
home: https://github.com/jakehigg/joshua-ai
sources:
  - https://github.com/jakehigg/joshua-ai
keywords:
  - agent
  - assistant
  - mcp
maintainers:
  - name: jakehigg
    url: https://github.com/jakehigg
