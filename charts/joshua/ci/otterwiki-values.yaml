# Values that render the Otter Wiki enhancement in CI. They exercise the
# enhancement's paths on top of the base test values, and they name no real
# deployment.
config: |
  name: Test House
  timezone: UTC
  people:
    - id: alex
      name: Alex
      role: member
      handles:
        telegram: "123456789"
persistence:
  storageClass: ""
  volumeName: joshua-data-pv
ingress:
  enabled: true
  className: nginx
  host: joshua.example.com
  tls:
    enabled: true
enhancements:
  wiki:
    use: otterwiki
    otterwiki:
      ingress:
        enabled: true
        className: nginx
        host: wiki.example.com
        tls:
          enabled: true
