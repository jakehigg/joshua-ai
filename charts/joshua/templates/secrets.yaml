{{- if .Values.secrets.create }}
{{/* The Secrets the chart makes from values, for an installation that keeps
     everything in one file. Two blocks can name one Secret, such as postgres
     and core by default, so the keys are grouped by name first. */}}
{{- $byName := dict -}}
{{- range $component := (list "core" "channels" "gateway" "postgres") -}}
{{- $block := index $.Values.secrets $component -}}
{{- with $block.values -}}
{{- $merged := mergeOverwrite (deepCopy (index $byName $block.name | default dict)) . -}}
{{- $_ := set $byName $block.name $merged -}}
{{- end -}}
{{- end -}}
{{- range $name, $data := $byName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "joshua.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
