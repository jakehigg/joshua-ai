{{- if .Values.imagePullSecret.create }}
{{/* A login for a registry that holds the images. The chart adds this Secret to
     every pod's imagePullSecrets. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  labels:
    {{- include "joshua.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ include "joshua.dockerConfigJson" . | quote }}
{{- end }}
