{{/* One ClusterIP Service for each container. An in-cluster caller uses the
     short name in the namespace, such as http://joshua-core:8000. The viewer
     gets one only when it runs. */}}
{{- $names := list "core" "channels" "gateway" }}
{{- if .Values.viewer.enabled }}{{- $names = append $names "viewer" }}{{- end }}
{{- range $name := $names }}
apiVersion: v1
kind: Service
metadata:
  name: joshua-{{ $name }}
  labels:
    app.kubernetes.io/name: joshua-{{ $name }}
    {{- include "joshua.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: joshua-{{ $name }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
{{- end }}
