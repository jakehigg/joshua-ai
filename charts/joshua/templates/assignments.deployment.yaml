{{- if .Values.assignments.enabled }}
{{/* The assignments container: long jobs that run for a member in the
     background. It holds no model credential and no upstream credential. It
     reads /data (the people file) and writes nothing there. The gateway calls
     /mcp, and the viewer, when it is on, calls the read API under /v1/.

     Two switches turn it on, and both are needed. This one puts the pod in the
     cluster. `assignments.enabled: true` inside `config` lets the process
     start; without it the container exits and says so in its log. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joshua-assignments
  labels:
    app.kubernetes.io/name: joshua-assignments
    {{- include "joshua.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.assignments.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: {{ .Values.assignments.strategy }}
  selector:
    matchLabels:
      app.kubernetes.io/name: joshua-assignments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joshua-assignments
        {{- include "joshua.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: assignments
          image: {{ include "joshua.image" (dict "root" $ "name" "assignments") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          securityContext:
            {{- include "joshua.containerSecurityContext" . | nindent 12 }}
          env:
            - name: JOSHUA_CONFIG
              value: /etc/joshua/joshua.yaml
            - name: JOSHUA_DATA_DIR
              value: /data
            - name: CHANNELS_URL
              value: http://joshua-channels:8000
            - name: CORE_URL
              value: http://joshua-core:8000
            - name: GATEWAY_URL
              value: http://joshua-gateway:8000
            {{- include "joshua.secretEnv" (dict "secret" .Values.secrets.assignments) | nindent 12 }}
          resources:
            {{- toYaml .Values.assignments.resources | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/joshua
              readOnly: true
            - name: work
              mountPath: /work
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "joshua.configMapName" . }}
        - name: work
          {{- if .Values.assignments.work.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.assignments.work.existingClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.assignments.work.sizeLimit }}
          {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default "joshua-data" }}
            readOnly: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.assignments.networkPolicy.enabled }}
{{- $np := .Values.assignments.networkPolicy }}
---
{{/* Only the gateway reaches the container, and the viewer when it is on (the
     read API). The container reaches gateway, channels, core, the database,
     DNS, and the git hosts, and nothing else: no model server and no other
     host on the internet. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: joshua-assignments
  labels:
    app.kubernetes.io/name: joshua-assignments
    {{- include "joshua.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: joshua-assignments
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: joshua-gateway
        {{- if .Values.viewer.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: joshua-viewer
        {{- end }}
        {{- with $np.extraIngress }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        {{- range $name := list "gateway" "channels" "core" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: joshua-{{ $name }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: joshua-postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if $np.database.cidrs }}
    - to:
        {{- range $np.database.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $np.database.port }}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $np.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if $np.gitHosts.cidrs }}
    - to:
        {{- range $np.gitHosts.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $np.gitHosts.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
