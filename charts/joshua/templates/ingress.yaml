{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.enabled needs ingress.host" }}
{{- end }}
{{/* Only channels is reachable from outside. core holds the agent and gateway
     holds every upstream credential, so neither is ever exposed. */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: joshua-channels
  labels:
    app.kubernetes.io/name: joshua-channels
    {{- include "joshua.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" .Values.ingress.host) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: joshua-channels
                port:
                  number: 8000
{{- end }}
