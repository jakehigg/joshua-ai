{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{/* One volume for all three containers, so the access mode is ReadWriteMany.
     A storageClass of "" disables dynamic provisioning for a statically bound
     volume; leaving it unset uses the cluster default. */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: joshua-data
  labels:
    {{- include "joshua.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if not (eq .Values.persistence.storageClass "unset") }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  {{- with .Values.persistence.volumeName }}
  volumeName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
