{{- if .Values.postgres.enabled }}
{{/* An optional Postgres with pgvector, for an instance with no database of its
     own. Point core's DATABASE_URL at your own server and set
     postgres.enabled to false to use that instead. */}}
apiVersion: v1
kind: Service
metadata:
  name: joshua-postgres
  labels:
    app.kubernetes.io/name: joshua-postgres
    {{- include "joshua.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: joshua-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: joshua-postgres
  labels:
    app.kubernetes.io/name: joshua-postgres
    {{- include "joshua.labels" . | nindent 4 }}
spec:
  serviceName: joshua-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: joshua-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joshua-postgres
        {{- include "joshua.labels" . | nindent 8 }}
    spec:
      {{- include "joshua.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            {{/* PGDATA sits in a subdirectory, because the mount point itself is
                 not empty on every storage class. */}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- include "joshua.secretEnv" (dict "secret" .Values.secrets.postgres) | nindent 12 }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.postgres.storage.volumeName }}
        volumeName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
