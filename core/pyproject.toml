[project]
name = "joshua-core"
version = "0.0.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "joshua-shared",
    "claude-agent-sdk>=0.2.144",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "fastembed>=0.3",
]

[tool.uv.sources]
joshua-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
