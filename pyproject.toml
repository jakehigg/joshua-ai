[project]
name = "joshua-v4"
version = "0.0.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "channels", "core", "gateway"]

[tool.uv.sources]
joshua-shared = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
# The vendored ste-writing skill is third-party tooling, not project code.
extend-exclude = [".claude"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
markers = ["integration: needs services or network"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
