[project]
name = "joshua-channels"
version = "0.0.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "joshua-shared",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-telegram-bot==22.8",
    "httpx>=0.27",
    "cachetools>=5.3",
    "pillow>=11",
    "pillow-heif>=0.18",
]

[tool.uv.sources]
joshua-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
