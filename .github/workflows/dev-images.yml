# A push to any branch, main included, builds the three images for amd64 and
# tags them with the commit SHA and branch-<name>. branch-main is always the
# newest commit on main, so ArgoCD can follow main the same way it follows any
# other branch. Point the ArgoCD Application at the branch and set image.tag
# to $ARGOCD_APP_REVISION: each push then deploys the images of the commit it
# resolved. charts/joshua/README.md has the Application.
#
# Nothing here releases. A release is a v* tag, in release.yml, and is the
# only multi-arch build with a packaged chart. A branch build is amd64 only,
# because the emulated arm64 build of the core image is slow and a test
# cluster is one architecture.
name: dev-images

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: [channels, core, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: the full commit SHA, which never moves, and branch-<name>,
      # which moves with each push. A branch name can hold a character a tag
      # cannot, such as a slash, so the branch tag replaces those.
      - name: name the tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/joshua-ai-${{ matrix.member }}
        run: |
          branch=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-100)
          echo "tags=${IMAGE}:${GITHUB_SHA},${IMAGE}:branch-${branch}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.member }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          # The same scope as the release build, so a branch starts from the
          # layers of the last release.
          cache-from: type=gha,scope=${{ matrix.member }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.member }}-amd64
