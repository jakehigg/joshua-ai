# The whole deployment on one host. `make init-env && make up` starts the four
# services. The viewer and assignments are in profiles: `make up` turns each
# one on when joshua.yaml enables it. The images come from the GitHub
# container registry, so nothing is built here: set JOSHUA_VERSION in `.env`
# to take another release.
#
# To run your own build instead, run `make up-dev`, which adds
# docker-compose.dev.yml.
#
# Secrets come only from `.env` (see `.env.example`). No secret is written in
# this file; every value is a literal or a `${VAR}` from `.env`.
#
# Network: three networks, at the bottom of this file. `default` has a route to
# the internet, which `core` (Anthropic API, SDK web tools), `gateway` (MCP
# upstreams), `channels` (Telegram, BlueBubbles) and `assignments-git-proxy`
# (the git hosts) need. `closed` has none (`internal: true`), and the
# assignments container is on it alone, so a shell in an assignment session
# reaches the other containers and no host on the open web: a clone goes to the
# git proxy, which is a container of its own. Egress to one destination alone is
# the job of a firewall around the host, which compose cannot express.

# All three app containers hold every fleet token, because each one verifies
# the callers it trusts (see CLAUDE.md, "Identity and auth"). `make init-env`
# mints the values into `.env`.
x-fleet-tokens: &fleet-tokens
  JOSHUA_TOKEN_CHANNELS: ${JOSHUA_TOKEN_CHANNELS:-}
  JOSHUA_TOKEN_CORE: ${JOSHUA_TOKEN_CORE:-}
  JOSHUA_TOKEN_GATEWAY: ${JOSHUA_TOKEN_GATEWAY:-}
  JOSHUA_TOKEN_LAPTOP: ${JOSHUA_TOKEN_LAPTOP:-}
  # Callers of core's POST /v1/memory/search (memory.search.allowed_callers):
  # the viewer, and the joshua-mcp addon.
  JOSHUA_TOKEN_VIEWER: ${JOSHUA_TOKEN_VIEWER:-}
  JOSHUA_TOKEN_MCP: ${JOSHUA_TOKEN_MCP:-}
  # The assignments container: core's model forwarder and usage write, the
  # gateway MCP routes, and channels events.
  JOSHUA_TOKEN_ASSIGNMENTS: ${JOSHUA_TOKEN_ASSIGNMENTS:-}

# The channel credentials go to `channels` alone. joshua.yaml references them
# as ${VAR:-}, so a container without the variable expands it to the empty
# string; only the container that owns a secret defines it.
x-config-vars: &config-vars
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  BLUEBUBBLES_PASSWORD: ${BLUEBUBBLES_PASSWORD:-}
  IMESSAGE_WEBHOOK_SECRET: ${IMESSAGE_WEBHOOK_SECRET:-}

# Runtime knobs every container reads. Documented in .env.example.
x-runtime-vars: &runtime-vars
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# The config, read-only, at the path every service reads it from
# (JOSHUA_CONFIG=/etc/joshua/joshua.yaml). The mount is the folder that holds
# joshua.yaml, not the file itself: an editor that writes a new file — `sed -i`
# does, and so do most editors — gives the file a new inode, and a container
# that bind-mounted the old one keeps reading a file that is gone, until it is
# restarted. A folder mount follows the edit.
x-config-mount: &config-mount ".:/etc/joshua:ro"

# Each app serves `/healthz` on port 8000. The slim images have no curl, so the
# check uses python. `urlopen` exits non-zero on a non-200 response.
x-app-healthcheck: &app-healthcheck
  test:
    ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: joshua
      POSTGRES_DB: joshua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "joshua", "-d", "joshua"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [default, closed]
    # Not published on the host. Only `core` connects, over the compose network.

  gateway:
    image: ghcr.io/jakehigg/joshua-ai-gateway:${JOSHUA_VERSION:-0.4.3}
    restart: unless-stopped
    environment:
      <<: [*fleet-tokens, *runtime-vars]
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      ADMIN_CALLERS: laptop
      # The items of a tool call from a workspace go to core, with
      # JOSHUA_TOKEN_GATEWAY. This is also the default in code.
      CORE_URL: http://core:8000
      # The token of the Jupyter server in the code execution container, for
      # the `code-execution` builtin. Empty when code execution is off.
      CODE_EXECUTION_TOKEN: ${CODE_EXECUTION_TOKEN:-}
    # Every upstream credential an `mcp:` entry names with `${VAR:-}`: one
    # `NAME=value` line per variable in `.env.gateway`, which is yours and is
    # gitignored. It is optional, so a stack with no upstream credential starts
    # without it. This file, not `.env`, is where an MCP server's token goes:
    # the gateway is the only container that may hold one. The optional key of
    # the SearXNG instance of `internet.search` (`SEARXNG_API_KEY`) goes here
    # too: the gateway calls SearXNG, and core never gets the key.
    env_file:
      - path: .env.gateway
        required: false
    volumes:
      - *config-mount
      - data:/data
      # The MCP package store. Derived data: the gateway installs each
      # `package:` entry here at start. It is not backed up, and `make nuke`
      # drops it; the next start installs everything again.
      - mcp-store:/opt/joshua-mcp
    networks: [default, closed, code-execution]
    healthcheck: *app-healthcheck

  core:
    image: ghcr.io/jakehigg/joshua-ai-core:${JOSHUA_VERSION:-0.4.3}
    restart: unless-stopped
    environment:
      <<: [*fleet-tokens, *runtime-vars]
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      DATABASE_URL: postgresql://joshua:${POSTGRES_PASSWORD:-}@postgres:5432/joshua
      GATEWAY_URL: http://gateway:8000
      CHANNELS_URL: http://channels:8000
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # The server and the key of the `inference` section, when it names them.
      # Add a job key with another name here too. Core removes the provider
      # variables from its environment at start.
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      # The embedding model is downloaded once into the model-cache volume.
      MEMORY_EMBED_CACHE_DIR: ${MEMORY_EMBED_CACHE_DIR:-/home/app/.cache/fastembed}
      # `sdk` uses the Claude Agent SDK. `stub` needs no Anthropic token.
      AGENT_BACKEND: ${AGENT_BACKEND:-sdk}
      # Read-only token for the optional memos memory source.
      MEMOS_TOKEN: ${MEMOS_TOKEN:-}
      # Encrypts every secret setting of the instance at rest (docs/settings.md).
      # Without it, a secret setting cannot be written or read; the rest works.
      JOSHUA_SETTINGS_KEY: ${JOSHUA_SETTINGS_KEY:-}
      # The old viewer passwords, for the one-time import of the sign-in
      # secrets. Core reads them at the first start after the upgrade, writes
      # a hash for each person who has none, and marks the import done. Delete
      # the variable from `.env` afterwards.
      VIEWER_PASSWORDS: ${VIEWER_PASSWORDS:-}
    volumes:
      - *config-mount
      - data:/data
      # The SDK config dir. A named volume keeps sessions across restarts.
      - claude-config:/home/app/.claude
      # The embedding model (about 65 MB). A named volume keeps it across
      # restarts, so core downloads it once instead of on every start.
      - model-cache:/home/app/.cache/fastembed
    # Published on the loopback address only, so `scripts/chat.py` on this host
    # reaches `/v1/turns/stream` with the laptop token. Nothing off the host can
    # reach it.
    ports:
      - "127.0.0.1:8081:8000"
    networks: [default, closed]
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck: *app-healthcheck

  channels:
    image: ghcr.io/jakehigg/joshua-ai-channels:${JOSHUA_VERSION:-0.4.3}
    restart: unless-stopped
    environment:
      <<: [*fleet-tokens, *config-vars, *runtime-vars]
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      CORE_URL: http://core:8000
    volumes:
      - *config-mount
      - data:/data
    # Published on the host so BlueBubbles and webhook callers reach it. Drop
    # this block when neither `channels.imessage` nor `channels.webhooks` runs.
    ports:
      - "8080:8000"
    networks: [default, closed]
    depends_on:
      core:
        condition: service_healthy
    healthcheck: *app-healthcheck

  # Read-only web viewer for the wiki and a person's own files. A second
  # entrypoint in the gateway image. Off by default; start it with
  # `make up` when joshua.yaml sets `viewer.enabled: true`: the Makefile
  # turns on the `viewer` profile. Set `viewer.auth.method` in joshua.yaml
  # first. Put a reverse proxy in front for
  # TLS. It gets `/data` (read-write, for the delete) and its own fleet token,
  # which it sends to core to search by meaning and to check a sign-in. It
  # holds no other fleet token, no upstream credential, and no password: core
  # holds every sign-in secret, hashed.
  #
  # It is published on the loopback address, on its own port, so it starts
  # beside the rest of the stack and nothing off the host reaches it. Put the
  # reverse proxy in front of 127.0.0.1:8082.
  viewer:
    image: ghcr.io/jakehigg/joshua-ai-gateway:${JOSHUA_VERSION:-0.4.3}
    profiles: ["viewer"]
    restart: unless-stopped
    # The gateway image entrypoint runs the gateway app; the viewer is the
    # second entrypoint in the same image.
    entrypoint: ["python", "-m", "joshua_gateway.viewer"]
    environment:
      <<: *runtime-vars
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      # Signs the session cookie. Without it the process mints a key at each
      # start, so a restart signs everybody out. Set it in `.env`.
      JOSHUA_VIEWER_SESSION_SECRET: ${JOSHUA_VIEWER_SESSION_SECRET:-}
      # Search by meaning: /search asks core. Without the token, the viewer
      # searches by words only.
      CORE_URL: http://core:8000
      JOSHUA_TOKEN_VIEWER: ${JOSHUA_TOKEN_VIEWER:-}
      # /assignments reads the assignments of the person who signed in from
      # the assignments container, with the same token. Without the
      # container, the page says that the manager did not answer.
      ASSIGNMENTS_URL: http://assignments:8000
      # The chat routes (/api/v1/chat/...) call channels, with the same token.
      CHANNELS_URL: http://channels:8000
    volumes:
      - *config-mount
      - data:/data
    ports:
      - "127.0.0.1:8082:8000"
    networks: [default, closed]
    # Core checks every sign-in, so the viewer waits for a healthy core. A
    # viewer that takes a secret before core answers refuses a correct one.
    depends_on:
      core:
        condition: service_healthy
    healthcheck: *app-healthcheck

  # Long jobs that run for a member in the background. Off by default; `make
  # up` starts it when joshua.yaml sets `assignments.enabled: true`: the
  # Makefile turns on the `assignments` profile. Add the container as
  # an `mcp:` server: docs/assignments.md has the steps. It is not published on
  # the host: the gateway calls /mcp, and the viewer calls the read API.
  #
  # It holds no model credential and no MCP credential. It gets the
  # database (the schema `assignments` in the same Postgres), its own fleet
  # token for the events it sends to channels, and the bearers of its callers.
  # `/data` is read-only: it reads the people file there and writes nothing.
  assignments:
    image: ghcr.io/jakehigg/joshua-ai-assignments:${JOSHUA_VERSION:-0.4.3}
    profiles: ["assignments"]
    restart: unless-stopped
    environment:
      <<: *runtime-vars
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      DATABASE_URL: postgresql://joshua:${POSTGRES_PASSWORD:-}@postgres:5432/joshua
      CHANNELS_URL: http://channels:8000
      # The runner reads the limits, writes the usage, and sends the model
      # calls of each session to core. A session reaches the MCP servers of
      # its person through the gateway.
      CORE_URL: http://core:8000
      GATEWAY_URL: http://gateway:8000
      JOSHUA_TOKEN_ASSIGNMENTS: ${JOSHUA_TOKEN_ASSIGNMENTS:-}
      # `<person-id>=<token>` pairs, comma separated. Each bearer names one
      # person. The gateway sends it (see docs/assignments.md).
      ASSIGNMENTS_TOKENS: ${ASSIGNMENTS_TOKENS:-}
      # A bearer that names no person and may only read.
      ADDON_TOKEN: ${ASSIGNMENTS_ADDON_TOKEN:-}
      # The viewer's own fleet token, the same value the viewer holds. The
      # manager checks it on the read API (assignments.read_callers). It is
      # never a bearer of /mcp.
      JOSHUA_TOKEN_VIEWER: ${JOSHUA_TOKEN_VIEWER:-}
      # The git proxy, in its own container. The runner writes this address
      # into the .gitconfig of each session, with a secret for that session.
      GIT_PROXY_URL: http://assignments-git-proxy:8003
    volumes:
      - *config-mount
      - data:/data:ro
      # The scratch directory of each assignment.
      - assignments-work:/work
    # The `closed` network alone: no route to the open web, and none to a git
    # host. A session holds private data — the wiki, the documents of the
    # person, a granted repository — so it reaches the other containers of the
    # stack and nothing else. Its research goes to the `internet` MCP server
    # through the gateway, and its clone to the git proxy below.
    networks: [closed]
    depends_on:
      postgres:
        condition: service_healthy
      channels:
        condition: service_healthy
    healthcheck: *app-healthcheck

  # The git proxy: the read-only git server of the sessions, in a container of
  # its own. It starts with the `assignments` profile, and it is the
  # assignments image with another entry point.
  #
  # It is the one container of the stack that reaches a git host, so it is on
  # `default` as well as `closed`. The assignments container is on `closed`
  # alone, which is why the proxy cannot run beside the session: a container
  # with a route to a git host gives its shell that route too.
  #
  # It holds the read token of each git host, under the name that
  # assignments.platforms.<host>.token_env gives, and the database. It holds no
  # fleet token: the secret of a running session, which the manager writes into
  # the .gitconfig of that session, is what opens the listener.
  assignments-git-proxy:
    image: ghcr.io/jakehigg/joshua-ai-assignments:${JOSHUA_VERSION:-0.4.3}
    profiles: ["assignments"]
    restart: unless-stopped
    entrypoint: ["python", "-m", "joshua_assignments.git_proxy"]
    environment:
      <<: *runtime-vars
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      # The grant of a running session and the row of its assignment, in the
      # schema `assignments` that the manager owns.
      DATABASE_URL: postgresql://joshua:${POSTGRES_PASSWORD:-}@postgres:5432/joshua
    # The read token of each git host. The same file as the manager's, so one
    # file holds the tokens of an installation; only this container reads the
    # git tokens from it.
    env_file:
      - path: .env.assignments
        required: false
    volumes:
      - *config-mount
    networks: [default, closed]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Code execution: the stock Jupyter scipy image, which runs Python for the
  # `code-execution` builtin of the gateway. Off by default; `make up` starts it when
  # joshua.yaml sets `code_execution.enabled: true`. docs/code-execution.md has the design.
  #
  # It is on the `code-execution` network alone, with the gateway: no route to the
  # open web, and no other container reaches it. It mounts no volume of the
  # stack and holds no credential except its own Jupyter token. The gateway
  # copies the files of a run in. Its only writable storage is the two tmpfs
  # mounts, so a restart starts it empty.
  code-execution:
    image: quay.io/jupyter/scipy-notebook:2026-11-23@sha256:21b93d2df02daa665b11442282d01f96d5a639e8ca9045cfd296e2896709b2fc
    profiles: ["code-execution"]
    restart: unless-stopped
    user: "1000:100"
    # Jupyter turns its auth off with an empty token, so the container refuses
    # to start without one.
    command:
      - sh
      - -c
      - 'test -n "$$JUPYTER_TOKEN" || { echo "JUPYTER_TOKEN is empty: set CODE_EXECUTION_TOKEN in .env" >&2; exit 1; }; exec jupyter server "$$@"'
      - code-execution
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.port=8888
      - --ServerApp.root_dir=/home/jovyan
      - --ServerApp.open_browser=False
      - --ServerApp.allow_remote_access=True
      - --ServerApp.terminals_enabled=False
      # A kernel that is idle for 30 minutes is shut down.
      - --MappingKernelManager.cull_idle_timeout=1800
      - --MappingKernelManager.cull_interval=300
      - --MappingKernelManager.cull_connected=True
    environment:
      # The server reads its token from JUPYTER_TOKEN. The gateway sends the
      # same value as CODE_EXECUTION_TOKEN.
      JUPYTER_TOKEN: ${CODE_EXECUTION_TOKEN:-}
    read_only: true
    tmpfs:
      - /home/jovyan:uid=1000,gid=100,mode=0700,size=2g
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    networks: [code-execution]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/api')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # `make validate`: check joshua.yaml once, and exit. It runs from the core
  # image and has no network. It gets the channel credentials and the old
  # viewer passwords only to report on them: the summary names a channel only
  # when its credential is set, and the old passwords get a warning. It
  # never starts with the stack.
  validate:
    image: ghcr.io/jakehigg/joshua-ai-core:${JOSHUA_VERSION:-0.4.3}
    profiles: ["validate"]
    entrypoint: ["joshua-config", "validate", "/etc/joshua/joshua.yaml"]
    network_mode: none
    environment:
      <<: *config-vars
      VIEWER_PASSWORDS: ${VIEWER_PASSWORDS:-}
    volumes:
      - *config-mount

networks:
  # The stack network. It has a route to the internet.
  default:
  # No route off the host: `internal: true` gives the network no gateway, so a
  # container on this network alone reaches the other containers and nothing
  # beyond them. Docker's resolver still answers, so a name of the stack
  # resolves and a public name does not. Every container that talks to the
  # assignments container is on it: the gateway calls `/mcp`, the viewer calls
  # the read API, and the manager calls core, channels, postgres, and the git
  # proxy.
  closed:
    internal: true
  # No route off the host, and two containers only: the gateway, which
  # calls the Jupyter server, and the code execution container. The code of a run reaches
  # nothing else.
  code-execution:
    internal: true

volumes:
  pgdata:
  data:
  claude-config:
  model-cache:
  mcp-store:
  assignments-work:
