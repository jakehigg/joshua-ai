# The whole deployment on one host. `make init-env && make up` starts the four
# services. The viewer and assignments are in profiles, so they are off until
# you name the profile. The images come from the GitHub container registry, so nothing is
# built here: set JOSHUA_VERSION in `.env` to take another release.
#
# To run your own build instead, add the developer override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Secrets come only from `.env` (see `.env.example`). No secret is written in
# this file; every value is a literal or a `${VAR}` from `.env`.
#
# Network: compose puts every service on one default network. Only `core`
# (Anthropic API, SDK web tools) and `gateway` (MCP upstreams) reach the
# internet. Egress is not enforced here; that is a phase 6 concern.

# All three app containers hold every fleet token, because each one verifies
# the callers it trusts (see CLAUDE.md, "Identity and auth"). `make init-env`
# mints the values into `.env`.
x-fleet-tokens: &fleet-tokens
  JOSHUA_TOKEN_CHANNELS: ${JOSHUA_TOKEN_CHANNELS:-}
  JOSHUA_TOKEN_CORE: ${JOSHUA_TOKEN_CORE:-}
  JOSHUA_TOKEN_GATEWAY: ${JOSHUA_TOKEN_GATEWAY:-}
  JOSHUA_TOKEN_LAPTOP: ${JOSHUA_TOKEN_LAPTOP:-}
  # Callers of core's POST /v1/memory/search (memory.search.allowed_callers):
  # the viewer, and the joshua-mcp addon.
  JOSHUA_TOKEN_VIEWER: ${JOSHUA_TOKEN_VIEWER:-}
  JOSHUA_TOKEN_MCP: ${JOSHUA_TOKEN_MCP:-}
  # The assignments container: core's model forwarder and usage write, the
  # gateway MCP routes, and channels events.
  JOSHUA_TOKEN_ASSIGNMENTS: ${JOSHUA_TOKEN_ASSIGNMENTS:-}

# The channel credentials go to `channels` alone. joshua.yaml references them
# as ${VAR:-}, so a container without the variable expands it to the empty
# string; only the container that owns a secret defines it.
x-config-vars: &config-vars
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  BLUEBUBBLES_PASSWORD: ${BLUEBUBBLES_PASSWORD:-}
  IMESSAGE_WEBHOOK_SECRET: ${IMESSAGE_WEBHOOK_SECRET:-}

# Runtime knobs every container reads. Documented in .env.example.
x-runtime-vars: &runtime-vars
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# Each app serves `/healthz` on port 8000. The slim images have no curl, so the
# check uses python. `urlopen` exits non-zero on a non-200 response.
x-app-healthcheck: &app-healthcheck
  test:
    ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: joshua
      POSTGRES_DB: joshua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "joshua", "-d", "joshua"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Not published on the host. Only `core` connects, over the compose network.

  gateway:
    image: ghcr.io/jakehigg/joshua-ai-gateway:${JOSHUA_VERSION:-0.2.1}
    restart: unless-stopped
    environment:
      <<: [*fleet-tokens, *runtime-vars]
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      ADMIN_CALLERS: laptop
      # The items of a tool call from a workspace go to core, with
      # JOSHUA_TOKEN_GATEWAY. This is also the default in code.
      CORE_URL: http://core:8000
    # Every upstream credential an `mcp:` entry names with `${VAR:-}`: one
    # `NAME=value` line per variable in `.env.gateway`, which is yours and is
    # gitignored. It is optional, so a stack with no upstream credential starts
    # without it. This file, not `.env`, is where an MCP server's token goes:
    # the gateway is the only container that may hold one. The optional key of
    # the SearXNG instance of `internet.search` (`SEARXNG_API_KEY`) goes here
    # too: the gateway calls SearXNG, and core never gets the key.
    env_file:
      - path: .env.gateway
        required: false
    volumes:
      - ./joshua.yaml:/etc/joshua/joshua.yaml:ro
      - data:/data
      # The MCP package store. Derived data: the gateway installs each
      # `package:` entry here at start. It is not backed up, and `make nuke`
      # drops it; the next start installs everything again.
      - mcp-store:/opt/joshua-mcp
    healthcheck: *app-healthcheck

  core:
    image: ghcr.io/jakehigg/joshua-ai-core:${JOSHUA_VERSION:-0.2.1}
    restart: unless-stopped
    environment:
      <<: [*fleet-tokens, *runtime-vars]
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      DATABASE_URL: postgresql://joshua:${POSTGRES_PASSWORD:-}@postgres:5432/joshua
      GATEWAY_URL: http://gateway:8000
      CHANNELS_URL: http://channels:8000
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # The server and the key of the `inference` section, when it names them.
      # Add a job key with another name here too. Core removes the provider
      # variables from its environment at start.
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      # The embedding model is downloaded once into the model-cache volume.
      MEMORY_EMBED_CACHE_DIR: ${MEMORY_EMBED_CACHE_DIR:-/home/app/.cache/fastembed}
      # `sdk` uses the Claude Agent SDK. `stub` needs no Anthropic token.
      AGENT_BACKEND: ${AGENT_BACKEND:-sdk}
      # Read-only token for the optional memos memory source.
      MEMOS_TOKEN: ${MEMOS_TOKEN:-}
      # The old viewer passwords, for the one-time import of the sign-in
      # secrets. Core reads them at the first start after the upgrade, writes
      # a hash for each person who has none, and marks the import done. Delete
      # the variable from `.env` afterwards.
      VIEWER_PASSWORDS: ${VIEWER_PASSWORDS:-}
    volumes:
      - ./joshua.yaml:/etc/joshua/joshua.yaml:ro
      - data:/data
      # The SDK config dir. A named volume keeps sessions across restarts.
      - claude-config:/home/app/.claude
      # The embedding model (about 65 MB). A named volume keeps it across
      # restarts, so core downloads it once instead of on every start.
      - model-cache:/home/app/.cache/fastembed
    # Published on the loopback address only, so `scripts/chat.py` on this host
    # reaches `/v1/turns/stream` with the laptop token. Nothing off the host can
    # reach it.
    ports:
      - "127.0.0.1:8081:8000"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck: *app-healthcheck

  channels:
    image: ghcr.io/jakehigg/joshua-ai-channels:${JOSHUA_VERSION:-0.2.1}
    restart: unless-stopped
    environment:
      <<: [*fleet-tokens, *config-vars, *runtime-vars]
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      CORE_URL: http://core:8000
    volumes:
      - ./joshua.yaml:/etc/joshua/joshua.yaml:ro
      - data:/data
    # Published on the host so BlueBubbles and webhook callers reach it. Drop
    # this block when neither `channels.imessage` nor `channels.webhooks` runs.
    ports:
      - "8080:8000"
    depends_on:
      core:
        condition: service_healthy
    healthcheck: *app-healthcheck

  # Read-only web viewer for the wiki and a person's own files. A second
  # entrypoint in the gateway image. Off by default; start it with
  # `docker compose --profile viewer up`. Set `viewer.enabled: true` and
  # `viewer.auth.method` in joshua.yaml first. Put a reverse proxy in front for
  # TLS. It gets `/data` (read-write, for the delete) and its own fleet token,
  # which it sends to core to search by meaning and to check a sign-in. It
  # holds no other fleet token, no upstream credential, and no password: core
  # holds every sign-in secret, hashed.
  #
  # It is published on the loopback address, on its own port, so it starts
  # beside the rest of the stack and nothing off the host reaches it. Put the
  # reverse proxy in front of 127.0.0.1:8082.
  viewer:
    image: ghcr.io/jakehigg/joshua-ai-gateway:${JOSHUA_VERSION:-0.2.1}
    profiles: ["viewer"]
    restart: unless-stopped
    # The gateway image entrypoint runs the gateway app; the viewer is the
    # second entrypoint in the same image.
    entrypoint: ["python", "-m", "joshua_gateway.viewer"]
    environment:
      <<: *runtime-vars
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      # Signs the session cookie. Without it the process mints a key at each
      # start, so a restart signs everybody out. Set it in `.env`.
      JOSHUA_VIEWER_SESSION_SECRET: ${JOSHUA_VIEWER_SESSION_SECRET:-}
      # Search by meaning: /search asks core. Without the token, the viewer
      # searches by words only.
      CORE_URL: http://core:8000
      JOSHUA_TOKEN_VIEWER: ${JOSHUA_TOKEN_VIEWER:-}
      # /assignments reads the assignments of the person who signed in from
      # the assignments container, with the same token. Without the
      # container, the page says that the manager did not answer.
      ASSIGNMENTS_URL: http://assignments:8000
      # The chat routes (/api/v1/chat/...) call channels, with the same token.
      CHANNELS_URL: http://channels:8000
    volumes:
      - ./joshua.yaml:/etc/joshua/joshua.yaml:ro
      - data:/data
    ports:
      - "127.0.0.1:8082:8000"
    healthcheck: *app-healthcheck

  # Long jobs that run for a member in the background. Off by default; start
  # it with `docker compose --profile assignments up -d`. Set
  # `assignments.enabled: true` in joshua.yaml first, and add the container as
  # an `mcp:` server: docs/assignments.md has the steps. It is not published on
  # the host: the gateway calls /mcp, and the viewer calls the read API.
  #
  # It holds no model credential and no MCP credential. It gets the
  # database (the schema `assignments` in the same Postgres), its own fleet
  # token for the events it sends to channels, and the bearers of its callers.
  # `/data` is read-only: it reads the people file there and writes nothing.
  assignments:
    image: ghcr.io/jakehigg/joshua-ai-assignments:${JOSHUA_VERSION:-0.2.1}
    profiles: ["assignments"]
    restart: unless-stopped
    environment:
      <<: *runtime-vars
      JOSHUA_CONFIG: /etc/joshua/joshua.yaml
      DATABASE_URL: postgresql://joshua:${POSTGRES_PASSWORD:-}@postgres:5432/joshua
      CHANNELS_URL: http://channels:8000
      # The runner reads the limits, writes the usage, and sends the model
      # calls of each session to core. A session reaches the MCP servers of
      # its person through the gateway.
      CORE_URL: http://core:8000
      GATEWAY_URL: http://gateway:8000
      JOSHUA_TOKEN_ASSIGNMENTS: ${JOSHUA_TOKEN_ASSIGNMENTS:-}
      # `<person-id>=<token>` pairs, comma separated. Each bearer names one
      # person. The gateway sends it (see docs/assignments.md).
      ASSIGNMENTS_TOKENS: ${ASSIGNMENTS_TOKENS:-}
      # A bearer that names no person and may only read.
      ADDON_TOKEN: ${ASSIGNMENTS_ADDON_TOKEN:-}
      # The viewer's own fleet token, the same value the viewer holds. The
      # manager checks it on the read API (assignments.read_callers). It is
      # never a bearer of /mcp.
      JOSHUA_TOKEN_VIEWER: ${JOSHUA_TOKEN_VIEWER:-}
    # The read token of each git host, under the name that
    # assignments.platforms.<host>.token_env gives. Only the manager reads it;
    # a session clones through the manager and never sees it.
    env_file:
      - path: .env.assignments
        required: false
    volumes:
      - ./joshua.yaml:/etc/joshua/joshua.yaml:ro
      - data:/data:ro
      # The scratch directory of each assignment.
      - assignments-work:/work
    depends_on:
      postgres:
        condition: service_healthy
      channels:
        condition: service_healthy
    healthcheck: *app-healthcheck

volumes:
  pgdata:
  data:
  claude-config:
  model-cache:
  mcp-store:
  assignments-work:
